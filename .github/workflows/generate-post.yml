name: Generate blog post from queue

on:
  schedule:
    - cron: "0 10 * * *"  # Daily at 10am UTC
  workflow_dispatch:      # Also allows manual trigger from GitHub Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-generativeai pyyaml

      - name: Run post generator
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          output=$(python scripts/generate_post.py)
          echo "$output"

          slug=$(echo "$output" | grep "^slug=" | cut -d= -f2-)
          title=$(echo "$output" | grep "^title=" | cut -d= -f2-)
          publish=$(echo "$output" | grep "^publish=" | cut -d= -f2-)

          echo "slug=$slug" >> $GITHUB_OUTPUT
          echo "title=$title" >> $GITHUB_OUTPUT
          echo "publish=$publish" >> $GITHUB_OUTPUT

      - name: Check if a post was generated
        id: check
        run: |
          if [ -z "${{ steps.generate.outputs.slug }}" ]; then
            echo "generated=false" >> $GITHUB_OUTPUT
          else
            echo "generated=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and open PR
        if: steps.check.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG="${{ steps.generate.outputs.slug }}"
          TITLE="${{ steps.generate.outputs.title }}"
          PUBLISH="${{ steps.generate.outputs.publish }}"
          DATE=$(date +%Y-%m-%d)
          BRANCH="post/${SLUG}-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Record branch name in queue, then commit queue update to main
          python scripts/generate_post.py --set-branch "$BRANCH"
          git add queue/posts.yaml
          git commit -m "queue: mark '$TITLE' as created"
          git push origin main

          # Create feature branch with only the generated post content
          git checkout -b "$BRANCH"
          git add content/posts/
          git commit -m "draft: $TITLE"
          git push origin "$BRANCH"

          # Ensure the ready label exists on the repo
          gh label create "ready" \
            --color "0075ca" \
            --description "Mark a post PR as ready to auto-merge" \
            --force

          # Build label args — apply publish date label if set
          LABEL_ARGS=""
          MERGE_NOTE="add the 'ready' label to merge on the next daily check"
          if [ -n "$PUBLISH" ] && [ "$PUBLISH" != "None" ]; then
            gh label create "publish:${PUBLISH}" \
              --color "e4e669" \
              --description "Auto-merge on ${PUBLISH}" \
              --force
            LABEL_ARGS="--label publish:${PUBLISH}"
            MERGE_NOTE="add the 'ready' label, or it will auto-merge on ${PUBLISH}"
          fi

          printf "## Review checklist\n\n- [ ] Read through and edit anything that feels off\n- [ ] Replace any \`[IMAGE: ...]\` placeholders — push image files to this branch under \`content/posts/%s/\` or use shared images from \`static/images/shared/\`\n- [ ] Check affiliate shortcodes are correct\n- [ ] When ready: %s\n\n---\nGenerated by the KinnikuGlow post automation.\n" \
            "$SLUG" "$MERGE_NOTE" > /tmp/pr-body.md

          gh pr create \
            --title "Draft: $TITLE" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" \
            $LABEL_ARGS
