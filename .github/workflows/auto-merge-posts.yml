name: Auto merge post PRs

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      merged: ${{ steps.merge-posts.outputs.merged }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Merge qualifying post PRs
        id: merge-posts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TODAY=$(date -u +%Y-%m-%d)
          MERGED=false

          echo "Checking for post PRs to merge (today: $TODAY)"

          PR_LIST=$(gh pr list \
            --base main \
            --state open \
            --json number,headRefName,labels \
            --jq '.[] | select(.headRefName | startswith("post/")) | @json')

          while IFS= read -r pr_json; do

            [ -z "$pr_json" ] && continue

            NUMBER=$(echo "$pr_json" | jq -r '.number')
            LABELS=$(echo "$pr_json" | jq -r '.labels[].name')

            SHOULD_MERGE=false
            REASON=""

            if echo "$LABELS" | grep -Fxq "ready"; then
              SHOULD_MERGE=true
              REASON="has 'ready' label"
            fi

            PUBLISH_LABEL=$(echo "$LABELS" | grep -E '^publish:[0-9]{4}-[0-9]{2}-[0-9]{2}$' | head -1 || true)

            if [ -n "$PUBLISH_LABEL" ]; then
              PUBLISH_DATE="${PUBLISH_LABEL#publish:}"

              if [[ "$PUBLISH_DATE" < "$TODAY" || "$PUBLISH_DATE" == "$TODAY" ]]; then
                SHOULD_MERGE=true
                REASON="publish date $PUBLISH_DATE has arrived"
              else
                echo "PR #$NUMBER scheduled for $PUBLISH_DATE — skipping."
              fi
            fi

            if [ "$SHOULD_MERGE" = true ]; then
              echo "Merging PR #$NUMBER — $REASON"

              gh pr merge "$NUMBER" \
                --merge \
                --delete-branch

              echo "PR #$NUMBER merged successfully."
              MERGED=true
            else
              echo "PR #$NUMBER does not qualify for merging."
            fi

          done <<< "$PR_LIST"

          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

          if [ "$MERGED" = true ]; then
            echo "At least one PR was merged. Deployment will run."
          else
            echo "No PRs were merged. Deployment will NOT run."
          fi

  deploy:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: write